<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico — Disparos do Mestre</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🚀</div>
      <div>
        <div class="logo-text">Disparos do Mestre</div>
        <div class="logo-sub">Sistema de Disparos</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">Menu Principal</div>
      <a href="index.html" class="nav-link"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="campaigns.html" class="nav-link"><span class="nav-icon">📝</span> Campanhas</a>
      <a href="channels.html" class="nav-link"><span class="nav-icon">📡</span> Canais</a>
      <a href="courses.html" class="nav-link"><span class="nav-icon">🎓</span> Cursos</a>
      <a href="history.html" class="nav-link active"><span class="nav-icon">🕒</span> Histórico</a>
    </nav>
  </aside>

  <main class="main-wrapper">
    <header class="topbar">
      <div class="flex-center">
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <div>
          <h1 class="topbar-title">Histórico e Logs</h1>
          <div class="topbar-subtitle">Acompanhe os resultados dos disparos realizados</div>
        </div>
      </div>
    </header>

    <div class="page-content">
      <div class="card mb-4 filter-bar">
        <div class="filter-field">
          <label class="form-label" for="filter-status">Status</label>
          <select id="filter-status" class="form-control" onchange="currentPage=1; loadLog()">
            <option value="">Todos</option>
            <option value="success">✅ Sucesso</option>
            <option value="failed">❌ Falha</option>
            <option value="deleted">🗑️ Apagado</option>
            <option value="failed_delete">⚠️ Falha ao apagar</option>
          </select>
        </div>
        <div class="filter-field filter-field-wide">
          <label class="form-label" for="filter-campaign">Campanha</label>
          <select id="filter-campaign" class="form-control" onchange="currentPage=1; loadLog()">
            <option value="">Todas as Campanhas</option>
          </select>
        </div>
        <div class="filter-field filter-field-wide">
          <label class="form-label" for="filter-channel">Canal</label>
          <select id="filter-channel" class="form-control" onchange="currentPage=1; loadLog()">
            <option value="">Todos os Canais</option>
          </select>
        </div>
        <button class="btn btn-secondary" onclick="loadLog()">🔄 Atualizar</button>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="table-stack">
            <thead>
              <tr>
                <th>Campanha</th>
                <th>Canal</th>
                <th>Status</th>
                <th>Data/Hora</th>
                <th>Motivo da falha</th>
              </tr>
            </thead>
            <tbody id="log-tbody">
              <tr><td colspan="5" class="empty-state-desc">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
        
        <div class="pagination" id="history-pagination"></div>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="assets/app.js"></script>
  <script>
    let currentPage = 1;
    const limit = 20;

    async function loadFilters() {
      try {
        const [campaigns, channels] = await Promise.all([apiFetch('/campaigns'), apiFetch('/channels')]);
        const campSel = document.getElementById('filter-campaign');
        campaigns.forEach(c => campSel.add(new Option(c.name, c.id)));
        const chSel = document.getElementById('filter-channel');
        channels.forEach(c => chSel.add(new Option(c.name, c.id)));
      } catch(e){}
    }

    async function loadLog() {
      const status = document.getElementById('filter-status').value;
      const campId = document.getElementById('filter-campaign').value;
      const chId = document.getElementById('filter-channel').value;

      let q = `?page=${currentPage}&limit=${limit}`;
      if (status) q += `&status=${status}`;
      if (campId) q += `&campaign_id=${campId}`;
      if (chId) q += `&channel_id=${chId}`;

      try {
        const data = await apiFetch(`/stats/log${q}`);
        
        const tb = document.getElementById('log-tbody');
        if (data.logs.length === 0) {
          tb.innerHTML = '<tr><td colspan="5" class="empty-state-desc" style="text-align:center;padding:30px">Nenhum registro encontrado.</td></tr>';
        } else {
          tb.innerHTML = data.logs.map(l => `
            <tr>
              <td class="cell-title"><strong>${escapeHtml(l.campaign_name || '(campanha excluída)')}</strong></td>
              <td>${escapeHtml(l.channel_name)}</td>
              <td>${statusBadge(l.status)}</td>
              <td style="white-space:nowrap">${fmtDate(l.sent_at)}</td>
              <td class="log-error" title="${escapeHtml(l.error_msg || '')}" ${l.error_msg ? `onclick="this.classList.toggle('expanded')"` : ''}>${l.error_msg ? escapeHtml(friendlyError(l.error_msg)) : '<span style="color:var(--text-muted)">—</span>'}</td>
            </tr>
          `).join('');
        }

        renderPagination('history-pagination', currentPage, Math.ceil(data.total / limit), data.total, p => goToPage(p), limit);

        // Keep the URL in sync so the filtered view can be refreshed or shared
        const qs = new URLSearchParams();
        if (status) qs.set('status', status);
        if (campId) qs.set('campaign', campId);
        if (chId) qs.set('channel', chId);
        history.replaceState(null, '', qs.toString() ? `?${qs}` : location.pathname);
      } catch (e) { toast('Erro ao carregar histórico', 'error'); }
    }

    // Called from the pagination buttons (renderPagination serializes the callback, so it must use globals)
    function goToPage(p) {
      currentPage = Math.max(1, p);
      loadLog();
      document.querySelector('.main-wrapper').scrollTop = 0;
    }

    // Pre-select filters passed in the URL (e.g. links from the dashboard cards)
    const params = new URLSearchParams(location.search);
    if (params.get('status')) document.getElementById('filter-status').value = params.get('status');

    loadFilters().then(() => {
      if (params.get('campaign')) {
        document.getElementById('filter-campaign').value = params.get('campaign');
      }
      if (params.get('channel')) {
        document.getElementById('filter-channel').value = params.get('channel');
      }
      loadLog();
    });
  </script>
</body>
</html>
